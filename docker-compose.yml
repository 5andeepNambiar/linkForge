services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: linkforge
      POSTGRES_USER: linkforge
      POSTGRES_PASSWORD: linkforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkforge -d linkforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    hostname: kafka
    container_name: linkforge-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  url-service:
    build:
      context: ./backend
      args:
        MODULE: url-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/linkforge
      SPRING_DATASOURCE_USERNAME: linkforge
      SPRING_DATASOURCE_PASSWORD: linkforge
      SPRING_DATA_REDIS_HOST: redis
      LINKFORGE_PUBLIC_BASE_URL: http://localhost:8082
      LINKFORGE_NODE_ID: 1
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redirect-service:
    build:
      context: ./backend
      args:
        MODULE: redirect-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/linkforge
      SPRING_DATASOURCE_USERNAME: linkforge
      SPRING_DATASOURCE_PASSWORD: linkforge
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LINKFORGE_NODE_ID: 2
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  analytics-service:
    build:
      context: ./backend
      args:
        MODULE: analytics-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/linkforge
      SPRING_DATASOURCE_USERNAME: linkforge
      SPRING_DATASOURCE_PASSWORD: linkforge
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - url-service
      - analytics-service

volumes:
  postgres-data:
  redis-data:
